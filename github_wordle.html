<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Wordle</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px auto; width: 300px; }
        .cell { width: 50px; height: 50px; border: 2px solid #ccc; font-size: 24px; line-height: 50px; }
        .keyboard { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
        .key { margin: 5px; padding: 10px; border: 1px solid #ccc; cursor: pointer; }
        .green { background-color: #6aaa64; }
        .yellow { background-color: #c9b458; }
        .gray { background-color: #787c7a; }
    </style>
</head>
<body>
    <h1>GitHub Wordle</h1>
    <div class="grid" id="guessGrid"></div>
    <div class="keyboard" id="keyboard"></div>
    <script>
        const words = ["commit", "branch", "merge", "label", "clone"];
        const secretWord = words[Math.floor(Math.random() * words.length)];
        let currentGuess = '';
        let currentRow = 0;

        function createGrid() {
            const grid = document.getElementById('guessGrid');
            for (let i = 0; i < 6; i++) {
                for (let j = 0; j < 5; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    grid.appendChild(cell);
                }
            }
        }

        function createKeyboard() {
            const keyboard = document.getElementById('keyboard');
            const keys = 'QWERTYUIOPASDFGHJKLZXCVBNM'.split('');

            keys.forEach(key => {
                const button = document.createElement('div');
                button.className = 'key';
                button.innerText = key;
                button.onclick = () => handleKeyPress(key);
                keyboard.appendChild(button);
            });
        }

        function handleKeyPress(key) {
            if (key === 'ENTER') {
                checkGuess();
            } else if (key === 'BACKSPACE') {
                currentGuess = currentGuess.slice(0, -1);
            } else if (currentGuess.length < 5) {
                currentGuess += key;
            }
            updateGrid();
        }

        function checkGuess() {
            if (currentGuess.length !== 5) return;
            const cells = document.querySelectorAll('.cell');
            for (let i = 0; i < 5; i++) {
                const letter = currentGuess[i];
                if (secretWord[i] === letter) {
                    cells[currentRow * 5 + i].classList.add('green');
                } else if (secretWord.includes(letter)) {
                    cells[currentRow * 5 + i].classList.add('yellow');
                } else {
                    cells[currentRow * 5 + i].classList.add('gray');
                }
            }
            currentRow++;
            currentGuess = '';
        }

        function updateGrid() {
            const cells = document.querySelectorAll('.cell');
            for (let i = 0; i < 5; i++) {
                cells[currentRow * 5 + i].innerText = currentGuess[i] || '';
            }
        }

        createGrid();
        createKeyboard();
    </script>
</body>
</html>
