<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Game</title>
    <style>
        /* Additional styles for improved game mechanics */
        body { font-family: Arial, sans-serif; }
        .feedback { margin-top: 20px; }
        .correct { background-color: green; }
        .present { background-color: yellow; }
        .absent { background-color: gray; }
    </style>
</head>
<body>
    <h1>Wordle Game</h1>
    <div id="game"></div>
    <script>
        // Improved JavaScript for proper letter deletion, keyboard controls, and correct color feedback
        const correctWord = 'APPLE';
        const guesses = [];
        const maxGuesses = 6;
        let currentGuess = '';

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Backspace') {
                currentGuess = currentGuess.slice(0, -1);
            } else if (event.key.length === 1 && currentGuess.length < 5) {
                currentGuess += event.key.toUpperCase();
            } else if (event.key === 'Enter' && currentGuess.length === 5) {
                submitGuess();
            }
            updateGameDisplay();
        });

        function submitGuess() {
            if (guesses.length < maxGuesses) {
                guesses.push(currentGuess);
                displayGuess(currentGuess);
                currentGuess = '';
            }
        }

        function displayGuess(guess) {
            const feedbackDiv = document.getElementById('game');
            const div = document.createElement('div');
            guess.split('').forEach((letter, index) => {
                const span = document.createElement('span');
                span.textContent = letter;
                if (correctWord.includes(letter)) {
                    span.classList.add(correctWord[index] === letter ? 'correct' : 'present');
                } else {
                    span.classList.add('absent');
                }
                div.appendChild(span);
            });
            feedbackDiv.appendChild(div);
            checkGameOver(guess);
        }

        function checkGameOver(guess) {
            if (guess === correctWord) {
                alert('Congratulations! You guessed the word!');
            } else if (guesses.length === maxGuesses) {
                alert('Game over! The correct word was ' + correctWord);
            }
        }

        function updateGameDisplay() {
            // TODO: Update the game display with current guess
        }
    </script>
</body>
</html>
